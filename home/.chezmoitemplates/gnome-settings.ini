# My GNOME settings: selected keys only (docs/philosophy.md §7, "selected keys").
# Loaded with `dconf load /`, which sets these keys and leaves everything else alone.
# Per machine, so not here: text scaling, touchpad/mouse speed, wallpaper, dock favourites,
# Do Not Disturb, extensions.
# Audit 2026-10-30 (B1 step 5): where Bluefin changed a GNOME default for a reason that
# doesn't apply to me, the GNOME default is written out here so it wins on Bluefin too.

# --- Look ---
[org/gnome/desktop/interface]
accent-color='slate'
enable-hot-corners=false
clock-show-weekday=true
show-battery-percentage=true

[org/gnome/desktop/wm/preferences]
button-layout=':minimize,maximize,close'

# --- Keyboard and windows ---
[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'ch+fr')]

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

# GNOME defaults: Alt+Tab and Super+Tab switch apps; Super+Space switches layout
# (Bluefin moved layout switching for the search-light extension, which I don't use).
[org/gnome/desktop/wm/keybindings]
switch-applications=['<Super>Tab', '<Alt>Tab']
switch-applications-backward=['<Shift><Super>Tab', '<Shift><Alt>Tab']
switch-windows=@as []
switch-windows-backward=@as []
switch-input-source=['<Super>space', 'XF86Keyboard']
switch-input-source-backward=['<Shift><Super>space', '<Shift>XF86Keyboard']
show-desktop=['<Super>d']
unmaximize=['<Super>Down', '<Alt>F5']

[org/gnome/mutter]
workspaces-only-on-primary=false
check-alive-timeout=uint32 20000

# Custom shortcuts: they call the apps directly, so they work off Bluefin too.
[org/gnome/settings-daemon/plugins/media-keys]
home=['<Super>e']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
name='Terminal'
binding='<Control><Alt>t'
command='ptyxis --new-window'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
name='Mission Center'
binding='<Control><Shift>Escape'
command='flatpak run io.missioncenter.MissionCenter'

# --- Touchpad ---
[org/gnome/desktop/peripherals/touchpad]
tap-to-click=true
two-finger-scrolling-enabled=true

# --- Night light ---
[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true
night-light-schedule-automatic=false
night-light-schedule-from=18.0
night-light-schedule-to=8.0
night-light-temperature=uint32 2648

# --- Power and screen ---
[org/gnome/settings-daemon/plugins/power]
power-button-action='nothing'
idle-dim=false
sleep-inactive-ac-type='nothing'

[org/gnome/desktop/session]
idle-delay=uint32 900

# --- Privacy and region ---
[org/gnome/system/location]
enabled=false

[system/locale]
region='en_GB.UTF-8'

# --- Files and file dialogs ---
[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'
fts-enabled=false

[org/gnome/nautilus/list-view]
use-tree-view=true
default-zoom-level='small'
default-visible-columns=['name', 'size', 'date_modified', 'date_created']

[org/gtk/gtk4/settings/file-chooser]
show-hidden=true
view-type='list'
sort-directories-first=true

# --- Ptyxis ---
[org/gnome/Ptyxis]
restore-session=true
interface-style='system'
audible-bell=false
profile-uuids=['2871e8027773ae74d6c87a5f659bbc74']
default-profile-uuid='2871e8027773ae74d6c87a5f659bbc74'

[org/gnome/Ptyxis/Profiles/2871e8027773ae74d6c87a5f659bbc74]
palette='Vs Code'
